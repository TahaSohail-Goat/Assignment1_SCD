name: Feature
description: Assignment-traceable feature work (sub-issue of a phase)
title: "[PXX-SYY] "
labels: ["type:feature", "status:ready"]
body:
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      description: Example ASG-FR-001, ASG-NFR-004
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: in_scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation / Evidence
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: A real repository collaborator only.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
    validations:
      required: true

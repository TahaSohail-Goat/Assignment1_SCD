# Continuous integration (ASG-CICD-003..011, 024..026).
# Runs on a pull request to main or dev and on a push to dev. It never publishes anything:
# publishing is cd.yml and release.yml (issue #52), gated by `needs:`.
#
# Third-party actions are pinned to a commit SHA (the tag is in the comment): a tag can be moved,
# a SHA cannot.
#
# Three jobs are switched on by the files they need, so this workflow is green from the first
# merge and starts checking each part the moment it lands:
#   - frontend test:    when frontend/package.json defines a "test" script (issue #36)
#   - frontend image:   when frontend/Dockerfile exists (issue #48)
#   - manifests:        when k8s/overlays/prod/kustomization.yaml exists (issue #49)
# The final audit (#56) fails if any of them is still switched off at submission.

name: ci

on:
  workflow_call:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-and-type:
    name: lint-and-type
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff (lint)
        working-directory: backend
        run: ruff check .
      - name: ruff (format)
        working-directory: backend
        run: ruff format --check .
      - name: mypy
        working-directory: backend
        run: mypy
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck
      - name: API contract snapshot
        working-directory: frontend
        run: npm run check:api-contract

  test-backend:
    name: test-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRIAGE_PROVIDER: simulated
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/civicpulse_test
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: civicpulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d civicpulse_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      # The coverage gate (--cov-fail-under=65 on app/) is part of the pytest options in
      # pyproject.toml, so this step fails below 65%.
      - name: pytest with coverage
        working-directory: backend
        run: pytest

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Is a test script defined yet
        id: has_tests
        run: |
          if node -e 'process.exit(require("./frontend/package.json").scripts?.test ? 0 : 1)'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::frontend/package.json has no test script yet (issue #36); nothing to run"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Frontend dependencies
        if: steps.has_tests.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Vitest
        if: steps.has_tests.outputs.present == 'true'
        working-directory: frontend
        run: npm test

  build:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is there a Dockerfile for this image yet
        id: has_dockerfile
        run: |
          if [ -f "${{ matrix.image }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.image }}/Dockerfile does not exist yet (issue #48); nothing to build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.has_dockerfile.outputs.present == 'true'
      # push: false: a pull request must not publish an image (ASG-CICD-007).
      - name: Build the image without pushing it
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: false
          tags: civicpulse-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  context-and-image-size:
    name: context-and-image-size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # ASG-DEVOPS-010 and 012: numbers, not adjectives. The build context is what `docker build`
      # sends to the daemon; the second figure is the same directory without its .dockerignore.
      - name: Backend build context and image size
        run: |
          # A developer's working tree after `pip install`: a virtualenv and bytecode caches sit
          # inside backend/, which is exactly what .dockerignore keeps out of the context.
          python3 -m venv backend/.venv
          backend/.venv/bin/pip install --quiet -r backend/requirements-dev.txt
          backend/.venv/bin/python -m compileall -q backend/app > /dev/null
          # BuildKit sends only the files a COPY asks for, which would hide the difference, so a
          # throwaway Dockerfile that copies the whole context ("COPY . /ctx") makes it visible.
          printf 'FROM scratch\nCOPY . /ctx\n' > /tmp/Dockerfile.size
          measure() {
            docker build --no-cache --progress=plain -f /tmp/Dockerfile.size "$1" 2>&1 \
              | grep -o 'transferring context: [0-9.]*[kMG]*B' | tail -1
          }
          with_ignore="$(measure backend)"
          rm -rf /tmp/noignore && cp -r backend /tmp/noignore && rm /tmp/noignore/.dockerignore
          without_ignore="$(measure /tmp/noignore)"
          docker build --no-cache -t civicpulse-backend:size backend > /dev/null
          {
            echo "### Backend"
            echo "- build context with .dockerignore: ${with_ignore#transferring context: }"
            echo "- build context without .dockerignore: ${without_ignore#transferring context: }"
            docker image ls civicpulse-backend:size --format '- image size: {{.Size}}'
            echo "- stage sizes:"
            docker history civicpulse-backend:size --format '  - {{.Size}}  {{.CreatedBy}}' | head -12
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Frontend build context and both image stage sizes
        run: |
          npm --prefix frontend ci --silent
          printf 'FROM scratch\nCOPY . /ctx\n' > /tmp/Dockerfile.size
          measure() {
            docker build --no-cache --progress=plain -f /tmp/Dockerfile.size "$1" 2>&1 \
              | grep -o 'transferring context: [0-9.]*[kMG]*B' | tail -1
          }
          with_ignore="$(measure frontend)"
          rm -rf /tmp/frontend-noignore && cp -r frontend /tmp/frontend-noignore
          rm /tmp/frontend-noignore/.dockerignore
          without_ignore="$(measure /tmp/frontend-noignore)"
          docker build --target builder -t civicpulse-frontend:builder frontend > /dev/null
          docker build -t civicpulse-frontend:size frontend > /dev/null
          {
            echo "### Frontend"
            echo "- build context with .dockerignore: ${with_ignore#transferring context: }"
            echo "- build context without .dockerignore: ${without_ignore#transferring context: }"
            docker image ls civicpulse-frontend:builder --format '- builder stage size: {{.Size}}'
            docker image ls civicpulse-frontend:size --format '- runtime image size: {{.Size}}'
            echo '- runtime image contents:'
            docker run --rm --entrypoint sh civicpulse-frontend:size -c '! command -v node; test ! -d /app/node_modules; test ! -d /app/src'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  scan:
    name: scan (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is there a Dockerfile for this image yet
        id: has_dockerfile
        run: |
          if [ -f "${{ matrix.image }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.image }}/Dockerfile does not exist yet (issue #48); nothing to scan"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.has_dockerfile.outputs.present == 'true'
      - name: Build the image into the local daemon
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          load: true
          push: false
          tags: civicpulse-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
      # Fails on HIGH or CRITICAL findings that have a fixed version available (ASG-CICD-008).
      - name: Trivy
        if: steps.has_dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: civicpulse-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is there a production overlay yet
        id: has_overlay
        run: |
          if [ -f k8s/overlays/prod/kustomization.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::k8s/overlays/prod does not exist yet (issue #49); nothing to validate"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install kubeconform
        if: steps.has_overlay.outputs.present == 'true'
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      # kubectl (preinstalled on the runner) embeds kustomize.
      - name: kustomize build overlays/prod | kubeconform
        if: steps.has_overlay.outputs.present == 'true'
        run: |
          kubectl kustomize k8s/overlays/prod \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test-backend]
    env:
      API: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configuration from .env.example, with a throwaway password
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-'"$(openssl rand -hex 8)"'/' .env
          sed -i 's/^TRIAGE_PROVIDER=.*/TRIAGE_PROVIDER=rules/' .env
      - name: docker compose up -d
        run: docker compose up -d --build
      - name: Wait for /ready
        run: |
          curl --silent --show-error --fail --retry 40 --retry-delay 3 \
            --retry-connrefused --retry-all-errors "$API/ready"
      - name: POST a complaint, GET it back, assert the category
        run: |
          created="$(curl --silent --show-error --fail -X POST "$API/api/complaints" \
            -H 'Content-Type: application/json' \
            -d '{"text":"The water tap in our lane has had no supply for three days.","location":"Lane 3"}')"
          echo "$created"
          id="$(echo "$created" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "COMPLAINT_ID=$id" >> "$GITHUB_ENV"
          fetched="$(curl --silent --show-error --fail "$API/api/complaints/$id")"
          echo "$fetched"
          echo "$fetched" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["category"] == "water", body["category"]
          assert body["status"] == "open", body["status"]
          '
      - name: X-Cache goes MISS then HIT
        run: |
          # The POST above emptied the cache key, so the first read is a MISS and the second a HIT.
          first="$(curl --silent --show-error --fail -D - -o /dev/null "$API/api/stats" | tr -d '\r' | grep -i '^x-cache:' | awk '{print $2}')"
          second="$(curl --silent --show-error --fail -D - -o /dev/null "$API/api/stats" | tr -d '\r' | grep -i '^x-cache:' | awk '{print $2}')"
          echo "first=$first second=$second"
          test "$first" = "MISS"
          test "$second" = "HIT"
      - name: Networks and published ports (ASG-DEVOPS-013..016)
        run: |
          internal="$(docker network inspect civicpulse_internal --format '{{.Internal}}')"
          edge="$(docker network inspect civicpulse_edge --format '{{.Internal}}')"
          echo "internal.Internal=$internal edge.Internal=$edge"
          test "$internal" = "true"
          test "$edge" = "false"
          for service in database cache; do
            docker compose port "$service" "$([ "$service" = database ] && echo 5432 || echo 6379)"               && { echo "$service publishes a port"; exit 1; } || echo "$service publishes no port"
          done
          docker compose exec -T backend python -c "import socket; socket.create_connection(('database', 5432), 2); socket.create_connection(('cache', 6379), 2); print('backend reaches database and cache')"
      - name: Frontend cannot resolve database (ASG-DEVOPS-017)
        run: |
          if docker compose exec -T frontend ping -c 1 -W 2 database > /tmp/frontend-ping.txt 2>&1; then
            cat /tmp/frontend-ping.txt
            echo 'frontend unexpectedly reached database'
            exit 1
          fi
          cat /tmp/frontend-ping.txt
          grep -Eiq 'bad address|unknown host|Name or service not known' /tmp/frontend-ping.txt
          curl -fsS http://127.0.0.1:8080/ > /dev/null
      - name: Redis append-only file is on, on the named volume
        run: |
          docker compose exec -T cache redis-cli CONFIG GET appendonly | tee /dev/stderr | grep -qx yes
          docker volume inspect civicpulse_redisdata --format '{{.Name}} exists'
      - name: docker compose down, then up, preserves the rows (ASG-DATA-022)
        run: |
          docker compose down
          docker compose up -d
          curl --silent --show-error --fail --retry 40 --retry-delay 3             --retry-connrefused --retry-all-errors "$API/ready"
          fetched="$(curl --silent --show-error --fail "$API/api/complaints/$COMPLAINT_ID")"
          echo "$fetched"
          echo "$fetched" | python3 -c '
          import json, sys
          assert json.load(sys.stdin)["category"] == "water"
          '
      # The commands of docs/RUNBOOK.md sections 3, 4, 5, 7 and 10, run as written.
      - name: RUNBOOK commands
        run: |
          curl -fsS -H 'X-Request-ID: runbook-check' "$API/health"
          curl -fsS "$API/metrics" | head -3
          docker compose logs --tail 50 backend | grep -F '"request_id": "runbook-check"'             || docker compose logs --tail 50 backend | grep -F 'runbook-check'
          docker compose run --rm migrate alembic current
          docker compose run --rm migrate alembic upgrade head
          docker compose run --rm migrate python -m app.seed | tee /tmp/seed.txt
          grep -q '0 new complaints; 30 defined' /tmp/seed.txt
          curl -fsS -X POST "$API/api/complaints" -H 'Content-Type: application/json'             -d '{"text":"Garbage has not been collected from our street for a week.","location":"Ward 4"}' > /dev/null
          curl -si "$API/api/stats" | grep -i '^x-cache'
          docker compose exec -T cache redis-cli TTL stats:v1
          docker compose exec -T cache redis-cli GET stats:v1
          docker compose ps
      - name: Compose state and backend log on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: docker compose down -v
        if: always()
        run: docker compose down -v

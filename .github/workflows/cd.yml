# ASG-CICD-012..020, 022..023: revalidate the merged SHA before publishing/deploying.
name: cd
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      frontend-digest: ${{ steps.frontend.outputs.digest }}
      registry: ${{ steps.names.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Registry namespace
        id: names
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/civicpulse-backend:${{ github.sha }}
            ${{ steps.names.outputs.registry }}/civicpulse-backend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.names.outputs.registry }}/civicpulse-frontend:${{ github.sha }}
            ${{ steps.names.outputs.registry }}/civicpulse-frontend:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Backend SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.names.outputs.registry }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
          syft-version: v1.52.0
          artifact-name: backend-sbom.spdx.json
          format: spdx-json
          upload-release-assets: false
      - name: Frontend SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.names.outputs.registry }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}
          syft-version: v1.52.0
          artifact-name: frontend-sbom.spdx.json
          format: spdx-json
          upload-release-assets: false

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ${{ needs.build-push.outputs.registry }}
      BACKEND_DIGEST: ${{ needs.build-push.outputs.backend-digest }}
      FRONTEND_DIGEST: ${{ needs.build-push.outputs.frontend-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create ephemeral kind cluster
        run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          kind create cluster --name civicpulse --image kindest/node:v1.37.0 --wait 120s
          kubectl label node civicpulse-control-plane ingress-ready=true
      - name: Install ingress and autoscaling prerequisites
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          vpa=https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.8.0/vertical-pod-autoscaler/deploy
          kubectl apply -f "$vpa/vpa-v1-crd-gen.yaml"
          kubectl apply -f "$vpa/vpa-rbac.yaml"
          kubectl apply -f "$vpa/recommender-deployment.yaml"
          kubectl wait --for=condition=Established crd/verticalpodautoscalers.autoscaling.k8s.io --timeout=60s
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
          kubectl -n ingress-nginx wait --for=condition=complete job/ingress-nginx-admission-patch --timeout=120s
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=120s
      - name: Load the published digests under their SHA tags
        run: |
          docker pull "$REGISTRY/civicpulse-backend@$BACKEND_DIGEST"
          docker tag "$REGISTRY/civicpulse-backend@$BACKEND_DIGEST" "$REGISTRY/civicpulse-backend:$GITHUB_SHA"
          docker pull "$REGISTRY/civicpulse-frontend@$FRONTEND_DIGEST"
          docker tag "$REGISTRY/civicpulse-frontend@$FRONTEND_DIGEST" "$REGISTRY/civicpulse-frontend:$GITHUB_SHA"
          kind load docker-image --name civicpulse "$REGISTRY/civicpulse-backend:$GITHUB_SHA" "$REGISTRY/civicpulse-frontend:$GITHUB_SHA"
      - name: Create namespace and real Secret before applying workloads
        env:
          POSTGRES_PASSWORD: ${{ secrets.CIVICPULSE_DB_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          python3 - <<'PY' | kubectl apply -f -
          import json, os, re
          password = os.environ['POSTGRES_PASSWORD']
          if not re.fullmatch(r'[A-Za-z0-9]{32,}', password):
              raise SystemExit('Set CIVICPULSE_DB_PASSWORD to at least 32 alphanumeric characters')
          print(json.dumps({'apiVersion':'v1', 'kind':'Secret',
              'metadata':{'name':'civicpulse-secrets','namespace':'civicpulse'},
              'type':'Opaque', 'stringData':{'POSTGRES_PASSWORD':password,
              'GROQ_API_KEY':os.environ.get('GROQ_API_KEY') or 'unused'}}))
          PY
      - name: Apply production overlay using the merged SHA
        run: |
          # Runner-only substitution. Never push deployment commits to protected main.
          sed -i "s/REPLACE_WITH_COMMIT_SHA/$GITHUB_SHA/g" k8s/overlays/prod/kustomization.yaml
          kubectl apply -k k8s/overlays/prod
          kubectl -n civicpulse rollout status statefulset/database --timeout=180s
          kubectl -n civicpulse rollout status deployment/cache --timeout=120s
          kubectl -n civicpulse rollout status deployment/backend --timeout=180s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=120s
          kubectl -n civicpulse annotate deployment/backend deployment/frontend civicpulse/source-sha="$GITHUB_SHA" --overwrite
      - name: Smoke test through the Ingress
        run: |
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 8080:80 > /tmp/ingress-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          curl -fsS --retry 20 --retry-delay 2 --retry-all-errors -H 'Host: civicpulse.local' http://127.0.0.1:8080/ > /tmp/frontend.html
          grep -qi '<html' /tmp/frontend.html
          curl -fsS -H 'Host: civicpulse.local' http://127.0.0.1:8080/api/stats | python3 -c 'import json,sys; assert "total" in json.load(sys.stdin)'
          kubectl -n civicpulse get hpa
          {
            echo "Source: $GITHUB_SHA"
            echo "Backend: $BACKEND_DIGEST"
            echo "Frontend: $FRONTEND_DIGEST"
            kubectl -n civicpulse get deployments
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Workload status on failure (no Secrets)
        if: failure()
        run: |
          kubectl -n civicpulse get pods,deployments,statefulsets,hpa
          kubectl -n civicpulse get events --sort-by=.lastTimestamp
      - name: Remove ephemeral cluster
        if: always()
        run: kind delete cluster --name civicpulse

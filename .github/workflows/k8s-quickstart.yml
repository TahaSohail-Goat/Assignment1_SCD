# Proves the README's second command (ASG-GEN-008): `bash scripts/k8s-up.sh` puts the system on a
# kind cluster from a clean checkout. It runs when the script or the manifests change, and on
# demand. It never publishes anything and uses no secret.
name: k8s-quickstart
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ["scripts/k8s-up.sh", "k8s/**", ".github/workflows/k8s-quickstart.yml"]
  pull_request:
    branches: [dev, main]
    paths: ["scripts/k8s-up.sh", ".github/workflows/k8s-quickstart.yml"]
permissions:
  contents: read
concurrency:
  group: k8s-quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kind and kubectl
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          curl -fsSL --proto '=https' --tlsv1.2 https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl -o /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: A taken INGRESS_PORT fails at once and says so
        run: |
          python3 -m http.server 8091 --bind 127.0.0.1 > /dev/null 2>&1 &
          other_pid=$!
          sleep 1
          if INGRESS_PORT=8091 bash scripts/k8s-up.sh > /tmp/conflict.txt 2>&1; then
            cat /tmp/conflict.txt
            echo 'the script accepted a port that another service owns'
            exit 1
          fi
          cat /tmp/conflict.txt
          grep -q 'already in use' /tmp/conflict.txt
          kill "$other_pid"
      - name: bash scripts/k8s-up.sh (another HTTP service already owns port 8080)
        run: |
          # The first quickstart command publishes the frontend on 8080; the smoke test must not confuse it
          # with the Ingress (review of #99).
          python3 -m http.server 8080 --bind 127.0.0.1 > /dev/null 2>&1 &
          echo "OTHER_8080_PID=$!" >> "$GITHUB_ENV"
          sleep 1
          bash scripts/k8s-up.sh
      - name: RUNBOOK sections 11-12, autoscaler objects are present
        run: |
          kubectl -n civicpulse get pods
          kubectl -n civicpulse get hpa backend-hpa
          kubectl -n civicpulse describe vpa backend-vpa | grep -E 'Update Mode|Name:'
          kubectl -n civicpulse rollout status deployment/backend
      - name: The rate limit is shared by both backend replicas (ASG-CACHE-010)
        run: |
          kubectl -n civicpulse get deployment backend -o jsonpath='{.status.readyReplicas}' | grep -qE '^[2-9]'
          kubectl -n ingress-nginx port-forward service/ingress-nginx-controller 8090:80 > /dev/null 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors             -H 'Host: civicpulse.local' http://127.0.0.1:8090/api/stats -o /tmp/stats.json
          codes=""
          for i in $(seq 14); do
            code="$(curl -s --max-time 15 -o /tmp/response.txt -w '%{http_code}' -X POST \
              -H 'Host: civicpulse.local' -H 'Content-Type: application/json' \
              -d '{"text":"The tap in our lane has no water.","location":"Lane 3"}' \
              http://127.0.0.1:8090/api/complaints)"
            codes="$codes $code"
          done
          echo "status codes:$codes"
          echo "$codes" | grep -q 429
          test "$(echo "$codes" | grep -o 201 | wc -l)" -le 10
      - name: Deleting the database pod keeps every row (ASG-DATA-023)
        run: |
          fingerprint() {
            kubectl -n civicpulse exec -i database-0 -- sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At' \
              <<< "SELECT count(*), md5(string_agg(row_to_json(c)::text, E'\n' ORDER BY id)) FROM complaints c;"
          }
          before="$(fingerprint)"
          echo "before: $before"
          kubectl -n civicpulse delete pod database-0 --wait=true
          kubectl -n civicpulse wait --for=condition=Ready pod/database-0 --timeout=180s
          after="$(fingerprint)"
          echo "after:  $after"
          test "$before" = "$after"
          test "${before%%|*}" -ge 30
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n civicpulse get pods,events --sort-by=.lastTimestamp || true
          kubectl -n civicpulse logs deploy/backend --all-containers --tail=100 || true
      - name: Remove the cluster
        if: always()
        run: kind delete cluster --name civicpulse

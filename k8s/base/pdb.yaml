# At least one backend pod stays up during a voluntary disruption such as a node drain (ASG-K8S-015).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend

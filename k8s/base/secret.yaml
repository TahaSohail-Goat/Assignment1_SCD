# PLACEHOLDERS ONLY (ASG-K8S-011, ASG-DED-002). No real value is ever committed, not even base64.
#
# The overlays remove this object from what they render, so `kubectl apply -k` can never overwrite
# the real Secret with these placeholders. Create the real one out of band (values from the
# GitHub Secrets of the deploy job, or your own shell), before the first deployment:
#
#   kubectl -n civicpulse create secret generic civicpulse-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=GROQ_API_KEY="<your key, or the word unused while TRIAGE_PROVIDER=rules>"
#
# POSTGRES_PASSWORD goes into a URL: keep it to letters and digits.
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
  labels:
    app.kubernetes.io/part-of: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
  GROQ_API_KEY: REPLACE_ME

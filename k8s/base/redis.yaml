# Redis is a Deployment with a PVC (ASG-K8S-007): the cache and the rate-limit windows are
# rebuildable, so one replica with the append-only file on a claim is enough. `Recreate` because
# a ReadWriteOnce claim cannot be mounted by the old and the new pod at the same time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: civicpulse
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: civicpulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
        app.kubernetes.io/part-of: civicpulse
    spec:
      securityContext:
        fsGroup: 999 # the redis user of the alpine image owns the volume
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          args: ["--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cache-data

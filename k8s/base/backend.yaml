# The API: a Deployment of at least two replicas (ASG-K8S-004) with the three probes of the
# assignment, a zero-unavailable rolling update, and requests on every container (ASG-K8S-022:
# the HPA divides usage by the CPU request, so without one it would read <unknown>).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: civicpulse
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: civicpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # a new pod must be Ready before an old one is taken away
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: civicpulse
    spec:
      # Longer than the preStop sleep plus the time in-flight requests need (uvicorn drains on SIGTERM).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the `app` user of the image, numeric so the kubelet can verify it
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The application never creates or alters a table itself (ASG-DED-014): the schema is
        # applied here, before the API starts. If two replicas race on a first start, the loser
        # fails, is restarted, finds the schema current and exits 0.
        - name: migrate
          image: civicpulse-backend
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@database:5432/$(POSTGRES_DB)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: backend
          image: civicpulse-backend
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: POSTGRES_DB }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL # $(NAME) is expanded by Kubernetes from the variables above
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@database:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: REDIS_URL }
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: LOG_LEVEL }
            - name: TRIAGE_PROVIDER
              valueFrom:
                configMapKeyRef: { name: civicpulse-config, key: TRIAGE_PROVIDER }
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: civicpulse-secrets, key: GROQ_API_KEY }
          # startupProbe: slow start is not failure. Until it succeeds the other probes do not
          # run, so a slow boot (up to 30 x 2 s = 60 s) does not become a restart loop.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          # livenessProbe: a failure restarts the pod, so it must NOT depend on the database:
          # a database outage must not restart every backend pod at once. /health checks nothing
          # outside the process.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
          # readinessProbe: a failure only removes the pod from the Service, so it SHOULD depend
          # on the database and the cache: /ready checks both.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates to the Ingress and kube-proxy,
              # then SIGTERM starts the graceful shutdown: no connection is sent to a pod that has
              # already stopped accepting.
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }

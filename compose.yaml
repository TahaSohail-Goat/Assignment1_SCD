# CivicPulse, development stack (ASG-DEVOPS-013..027).
#   cp .env.example .env   (then change the password)
#   docker compose up --build
# The frontend and the Ollama service are added by issue #48; the deploy file is compose.prod.yaml.

name: civicpulse

services:
  database:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  cache:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # AOF on: an acknowledged write survives a restart (ASG-CACHE-011).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # One-shot: applies the migrations, then exits. The backend starts only after it succeeded, so
  # the application itself never creates or alters a table (ASG-DED-014).
  migrate:
    build:
      context: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    networks: [internal]
    depends_on:
      database:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build:
      context: ./backend
    image: civicpulse-backend:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://cache:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-rules}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # Development only: the source is mounted so an edit reloads the server without a rebuild.
    # compose.prod.yaml (issue #48) has no such mount: a deployed image must run exactly the code
    # it was built from, not whatever is on the host.
    volumes:
      - ./backend/app:/app/app:ro
    command:
      ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload", "--reload-dir", "/app/app"]
    # The only service on both networks: reachable from outside through edge, and it alone
    # reaches the database and the cache through internal.
    networks: [edge, internal]
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true # no route to the outside world: the database and the cache cannot be reached from it

volumes:
  pgdata: # the complaints survive `docker compose down`; without it the data lives in the container layer
  redisdata: # the AOF file: cached counters and rate-limit windows survive a cache restart
  ollama_models: # the downloaded model weights (gigabytes); used by the ollama service of issue #48
